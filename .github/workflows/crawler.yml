name: Cloud Telegram Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # تشغيل تلقائي كل 6 ساعات

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install aiohttp beautifulsoup4

      - name: Run Cloud Crawler
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u cloud_crawler.py
